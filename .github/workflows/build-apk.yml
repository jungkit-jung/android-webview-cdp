name: Build and Release APK

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android Build Tools
        run: |
          echo "Finding Android SDK tools..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "Using Android build tools from $BUILD_TOOLS_DIR"
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          else
            echo "No preinstalled build-tools found, installing via sdkmanager..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
            echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          fi

      - name: Build Signed APK
        env:
          KSPASS: agybrowser123
        run: |
          echo "PATH=$PATH"
          which aapt2 d8 apksigner javac
          bash ./build.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-agentic-browser-apk
          path: out/so7o-webview.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v0.1.0-build${{ github.run_number }}
          name: AGY Agentic Browser v0.1.0 (Build ${{ github.run_number }})
          body: |
            ### 🚀 AGY Agentic Browser for Android
            Built automatically via GitHub Actions!

            **Fitur Unggulan:**
            - Native Android WebView dengan Chrome DevTools Protocol (CDP) relay pada `127.0.0.1:9334`.
            - Terhubung langsung dengan Agent Antigravity / LLM lokal di Termux tanpa butuh PC / adb.
            - Browser sungguhan: Mendukung cookies, sesi login pribadi (dashboard perbankan, medsos, e-commerce).
            - Dilengkapi Top Bar interaktif (URL / Search, Tombol Navigasi, Indikator Aktif Agent).
          files: out/so7o-webview.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
