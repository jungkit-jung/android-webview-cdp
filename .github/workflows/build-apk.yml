name: Build and Release APK

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android Build Tools
        run: |
          echo "Finding Android SDK tools..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "Using Android build tools from $BUILD_TOOLS_DIR"
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          else
            echo "No preinstalled build-tools found, installing via sdkmanager..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
            echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          fi

      - name: Build Signed APK
        env:
          KSPASS: agybrowser123
        run: |
          echo "PATH=$PATH"
          which aapt2 d8 apksigner javac
          bash ./build.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-terminal-apk
          path: out/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v0.2.0-terminal-b${{ github.run_number }}
          name: AGY Terminal v0.2.0 (Dedicated App - Build ${{ github.run_number }})
          body: |
            ### 🚀 AGY Terminal (Dedicated Separate App)
            Aplikasi terpisah berdampingan dengan AGY Browser (tidak bentrok / tidak menimpa browser).
            
            **Package:** `app.so7o.terminal`
            **Label:** `AGY Terminal`
            **CDP Relay Port:** `127.0.0.1:9335` (AGY Browser tetap di `9334`)

            **Fitur Unggulan:**
            - **1:1 Orderbook Liquidity Heatmap (Bookmap-Style):** Rendering termal kedalaman limit order real-time di belakang candle.
            - **Sierra-Style Footprint (Number Bars):** Bid vs Ask per tick, kotak emas POC (Point of Control), dan delta volume.
            - **Live Signals Radar:** Aliran sinyal institusional Gold (XAUUSDT) & Crypto unmasked (Entry, TP1-4, SL, Walls).
            - **DOM Tape Ladder:** Level 2 live ladder dengan imbalance meter dan real-time tick execution tape.
            - **Dual Mode:** Bisa jalan online mandiri via Binance Public WebSocket tanpa Termux, atau terhubung ke Sovereign Engine lokal (Port 8000).
            - **Auto-Unlock Engine:** Otomatis membuka fitur Pro/Ultimate saat membuka TapeDelta Web.
          files: |
            out/agy-terminal.apk
            out/so7o-webview.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
